name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  BUILD_TOOLS: "36.0.0"
  APK: app/build/outputs/apk/release/app-release.apk
  AAB: app/build/outputs/bundle/release/app-release.aab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Release lint
        run: ./gradlew --no-daemon lintRelease

      - name: Check for signing secrets
        id: secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::Signing secrets are not available to pull requests; signed release steps skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Add the four signing secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Decode keystore (temporary)
        if: steps.secrets.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set +x
          KS_PATH="$RUNNER_TEMP/siptimer-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KS_PATH"
          chmod 600 "$KS_PATH"
          echo "ANDROID_KEYSTORE_FILE=$KS_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: steps.secrets.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify APK signature (not debug)
        if: steps.secrets.outputs.present == 'true'
        run: |
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          if grep -q "CN=Android Debug" apk-signature.txt; then
            echo "::error::Release APK is signed with the debug certificate"; exit 1
          fi
          grep -m1 "certificate SHA-256 digest" apk-signature.txt | awk -F': ' '{print toupper($2)}' | tr -d ': ' > apk-cert-sha256.txt
          test -s apk-cert-sha256.txt

      - name: Verify AAB integrity and signer
        if: steps.secrets.outputs.present == 'true'
        run: |
          # No -strict: bundletool AABs always trigger the harmless JDK 17+ warning
          # "signed in JarFile but is not signed in JarInputStream" (META-INF ordering), which -strict turns into a failure.
          jarsigner -verify -verbose -certs "$AAB" > aab-verify.txt 2>&1 || { tail -40 aab-verify.txt; exit 1; }
          grep -q "jar verified" aab-verify.txt || { tail -40 aab-verify.txt; echo "::error::AAB signature not verified"; exit 1; }
          if grep -qE "jar is unsigned|unsigned entries|digest error|SecurityException" aab-verify.txt; then
            tail -40 aab-verify.txt; echo "::error::AAB has unsigned or tampered entries"; exit 1
          fi
          if grep -q "CN=Android Debug" aab-verify.txt; then echo "::error::AAB signed with debug cert"; exit 1; fi
          keytool -printcert -jarfile "$AAB" | grep -m1 "SHA256:" | sed 's/.*SHA256: //' | tr -d ': ' | tr 'a-f' 'A-F' > aab-cert-sha256.txt
          echo "APK signer: $(cat apk-cert-sha256.txt)"
          echo "AAB signer: $(cat aab-cert-sha256.txt)"
          if [ "$(cat apk-cert-sha256.txt)" != "$(cat aab-cert-sha256.txt)" ]; then
            echo "::error::APK and AAB are signed by different certificates"; exit 1
          fi

      - name: Check permissions against allowlist
        if: steps.secrets.outputs.present == 'true'
        run: |
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          PKG=$("$BT/aapt2" dump packagename "$APK")
          "$BT/aapt2" dump permissions "$APK" | tee packaged-permissions.txt
          ALLOWED="android.permission.POST_NOTIFICATIONS
          android.permission.RECEIVE_BOOT_COMPLETED
          ${PKG}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          USED=$(grep -oE "uses-permission: name='[^']+'" packaged-permissions.txt | sed "s/uses-permission: name='//;s/'//")
          FAIL=0
          for p in $USED; do
            if ! printf '%s\n' "$ALLOWED" | sed 's/^ *//' | grep -qx "$p"; then
              echo "::error::Permission not in allowlist: $p"; FAIL=1
            fi
          done
          MERGED=$(find app/build/intermediates -path "*release*" -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Merged manifest: $MERGED"
          if [ -n "$MERGED" ]; then
            grep -oE 'uses-permission[^>]*android:name="[^"]+"' "$MERGED" | sed 's/.*android:name="//;s/"//' | sort -u | tee merged-permissions.txt
            for p in $(cat merged-permissions.txt); do
              if ! printf '%s\n' "$ALLOWED" | sed 's/^ *//' | grep -qx "$p"; then
                echo "::error::Merged manifest permission not in allowlist: $p"; FAIL=1
              fi
            done
          fi
          exit $FAIL

      - name: Native library / 16 KB check
        if: steps.secrets.outputs.present == 'true'
        run: |
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          SO_APK=$(unzip -Z1 "$APK" | grep -E '\.so$' || true)
          SO_AAB=$(unzip -Z1 "$AAB" | grep -E '\.so$' || true)
          {
            echo "# 16 KB page size findings"
            if [ -z "$SO_APK$SO_AAB" ]; then
              echo "No native .so libraries in the release APK or AAB (including transitive dependencies)."
              echo "16 KB ELF alignment does not apply; zip alignment checked below."
            else
              echo "Native libraries found:"; echo "$SO_APK"; echo "$SO_AAB"
            fi
          } > native-libs.txt
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > zipalign.txt 2>&1 || { cat zipalign.txt; echo "::error::zipalign 16 KB check failed"; exit 1; }
          if [ -n "$SO_APK" ]; then
            mkdir -p so && unzip -q -o "$APK" 'lib/*' -d so
            for f in $(find so -name '*.so'); do
              ALIGN=$(objdump -p "$f" | awk '/LOAD/ {print $NF}' | sort -u | tr '\n' ' ')
              echo "$f LOAD align: $ALIGN" >> native-libs.txt
              echo "$ALIGN" | grep -qE '2\*\*(1[4-9]|[2-9][0-9])' || { echo "::error::$f is not 16 KB aligned"; exit 1; }
            done
          fi
          cat native-libs.txt

      - name: Artifact sizes
        if: steps.secrets.outputs.present == 'true'
        run: |
          {
            echo "# Release artifacts"
            echo "- APK: $(stat -c %s "$APK") bytes ($(du -h "$APK" | cut -f1))"
            echo "- AAB: $(stat -c %s "$AAB") bytes ($(du -h "$AAB" | cut -f1))"
            echo "- Signer SHA-256: $(cat apk-cert-sha256.txt)"
            echo "- Commit: $GITHUB_SHA"
          } | tee release-report.md
          cat native-libs.txt >> release-report.md
          cat release-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified artifacts
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: siptimer-release-${{ github.run_number }}
          if-no-files-found: error
          path: |
            ${{ env.APK }}
            ${{ env.AAB }}
            release-report.md
            apk-signature.txt
            packaged-permissions.txt
            native-libs.txt

      - name: Room schema export check
        if: always()
        run: |
          ls -la app/schemas/com.egrmeister.siptimer.data.AppDatabase/ || true
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::warning::Room schema files were generated or changed by this build — commit app/schemas (download the schemas artifact)."
          fi

      - name: Upload Room schemas and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siptimer-schemas-and-reports-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            app/schemas/
            app/build/reports/
            app/build/outputs/mapping/release/mapping.txt

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/siptimer-release.p12"
          rm -rf so
